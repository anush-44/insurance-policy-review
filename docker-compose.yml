version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: policylens-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: policylens-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - QDRANT_MODE=server
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-base-en-v1.5}
    volumes:
      - ./data:/app/data
      - ./eval:/app/eval
    depends_on:
      qdrant:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: policylens-ui
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api

volumes:
  qdrant_data:
